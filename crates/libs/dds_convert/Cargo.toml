[package]
name = "dds_convert"
description = "In-process texture conversion: decode DDS/FTEX/raster sources, generate mips, encode BC1/BC3/BC7, cache results"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
block_compression.workspace = true
ftex.workspace = true
image.workspace = true
jxl.workspace = true
log.workspace = true
pes_version.workspace = true
sha2.workspace = true
thiserror.workspace = true
tiff.workspace = true
wezlib.workspace = true

# The GPU BC7 encoder (`src/gpu.rs`): native only, guardrail 6 (`CONTRIBUTING.md`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
block_compression = { workspace = true, features = ["wgpu"] }
wgpu.workspace = true

