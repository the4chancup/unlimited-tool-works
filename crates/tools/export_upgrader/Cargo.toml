[package]
name = "export_upgrader"
description = "The Export upgrader: old (AET) exports migrated to the Studio player-folder format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aesthetics_export.workspace = true
anyhow.workspace = true
archives.workspace = true
clap.workspace = true
dds_convert.workspace = true
egui.workspace = true
kit_config.workspace = true
pes_model.workspace = true
pes_savefile.workspace = true
fpc.workspace = true
fmdl.workspace = true
ftex.workspace = true
pes_version.workspace = true
roxmltree.workspace = true
studio_core.workspace = true
teams_list.workspace = true
toml.workspace = true
vtree.workspace = true
wezlib.workspace = true

[features]
# `test_exports`, the files a clean old export lacks, for tests that write old exports.
test-support = []

[dev-dependencies]
crossbeam-channel.workspace = true
# The integration tests are their own crate, which `cfg(test)` does not reach: they turn on
# `test-support` to complete their old exports with `test_exports`.
export_upgrader = { workspace = true, features = ["test-support"] }
pes_savefile = { workspace = true, features = ["test-support"] }
test_scratch.workspace = true
zip.workspace = true

[lints]
workspace = true
