[package]
name = "team_compiler"
description = "The Compiler: aesthetics exports to CPK archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aesthetics_export.workspace = true
anyhow.workspace = true
archives.workspace = true
base64.workspace = true
clap.workspace = true
color_tools.workspace = true
cpk.workspace = true
crossbeam-channel.workspace = true
dds_convert.workspace = true
egui.workspace = true
elevation.workspace = true
export_grid.workspace = true
fmdl.workspace = true
fpc.workspace = true
fpk.workspace = true
ftex.workspace = true
kit_config.workspace = true
log.workspace = true
model_convert.workspace = true
pes_model.workspace = true
pes_savefile.workspace = true
pes_version.workspace = true
pipeline.workspace = true
rayon.workspace = true
roxmltree.workspace = true
serde.workspace = true
studio_core.workspace = true
teams_list.workspace = true
toml.workspace = true
uniparam.workspace = true
vtree.workspace = true
wezlib.workspace = true

[features]
# `test_files`, the bytes of the files a clean export lacks, for tests that write exports.
test-support = ["aesthetics_export/test-support"]

[dev-dependencies]
aesthetics_export = { workspace = true, features = ["test-support"] }
pes_savefile = { workspace = true, features = ["test-support"] }
# The integration tests are their own crate, which `cfg(test)` does not reach: they turn on
# `test-support` to complete their exports with `test_files`' bytes.
team_compiler = { workspace = true, features = ["test-support"] }
test_scratch.workspace = true

[lints]
workspace = true
