[package]
name = "save_editor"
description = "The Save editor: the PES EDIT savefile's teams and players exchanged, patched and compared"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aatf.workspace = true
anyhow.workspace = true
clap.workspace = true
color_tools.workspace = true
cpk.workspace = true
crossbeam-channel.workspace = true
dds_convert.workspace = true
egui.workspace = true
fpc.workspace = true
log.workspace = true
pes_savefile.workspace = true
pes_version.workspace = true
rayon.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
studio_core.workspace = true
team_widgets.workspace = true
teams_list.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[features]
# `Tool::with_running_probe`, for tests that set which PES games run.
test-support = []

[dev-dependencies]
pes_savefile = { workspace = true, features = ["test-support"] }
# The integration tests are their own crate, which `cfg(test)` does not reach: they turn on
# `test-support` to set the running-game probe instead of reading the process list.
save_editor = { workspace = true, features = ["test-support"] }
# The journal tests read a written bundle back.
zip.workspace = true

[lints]
workspace = true
