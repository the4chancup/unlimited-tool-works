# cargo-deny configuration: the license allowlist (`spec/core/distribution.md` "License").
# Run through `just deps-check`. A license compatible with MIT OR Apache-2.0 (no copyleft
# obligation on Studio's source or binary) is added here when a dependency needs it; any other
# license is a question for the maintainer.

# Every feature on, so a dependency behind an optional feature is checked too.
[graph]
all-features = true

[licenses]
# The list is policy, not a mirror of the current graph: an allowed license nobody uses yet is
# not a warning.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    # LLVM-exception relaxes Apache-2.0 (object-code embedding, GPLv2 combining)
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Boost: clipboard-win and error-code, under eframe's clipboard (arboard)
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # A public-domain dedication: tiny-keccak, under rhai's ahash `compile-time-rng`, which rhai
    # enables whatever its features
    "CC0-1.0",
    # Font licenses, for egui's bundled default fonts only (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # A permissive data license: webpki-root-certs, which ureq's certificate verifier
    # (rustls-platform-verifier) pulls only for wasm32 and its own tests
    "CDLA-Permissive-2.0",
]
