# cargo-nextest's settings for every nextest run: the mutation runs, the coverage map and any
# `just cargo nextest`. The gates run whole libtest binaries instead, and their runner
# (`scripts/gates/run_tests.py`) reads this file's limit.

[profile.default]
# A test past 180 seconds is stopped and fails (CONTRIBUTING.md "A test fails, it never hangs"):
# reported slow each minute, stopped at the third.
slow-timeout = { period = "60s", terminate-after = 3 }
